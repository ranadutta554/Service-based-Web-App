spring.application.name=com.edu
server.port=8086

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/info
spring.datasource.username=root
spring.datasource.password=2020
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MULTIPART CONFIG (IMPORTANT)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# 🔥 VERY IMPORTANT (YOUR ERROR FIX)
server.tomcat.max-part-count=50
